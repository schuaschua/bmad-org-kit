# Org Kit override (org-setup). Loads the org and project standards as persistent facts, and offers the
# architecture diagrams (Leonardo da Vinci), the governance assessments (Jules) and the cost estimate
# (Scrooge McDuck) once the architecture is done.
[workflow]
persistent_facts = [
  "file:{standards_glob}",
]
on_complete = "The architecture is complete, so three things can now be done from it. Ask the user once, in one message, which they would like: (1) Leonardo da Vinci (the leonardo-da-vinci skill) draws the architecture diagrams from the spine into the diagrams folder: C4 context, C4 containers, cloud deployment, data flow with trust boundaries and PII, and sequence diagrams for named flows, every box citing its AD, and challenges the spine's gaps first; (2) Jules (IT Governance, the agent-jules skill) fills in the Technical Architecture, Data Governance & Privacy and Enterprise AI Risk Assessments in the governance folder; (3) Scrooge McDuck (the agent-scrooge skill) prices the solution into the Excel cost estimate: a sheet per environment, the rate card and the team's mandays. They can pick any of them, all or none. Say that each works best in its own fresh session: run /clear, then say 'Leonardo, draw the architecture', 'Jules, answer the assessments' or 'Scrooge, estimate the cost'. Leonardo goes best first when Jules is also chosen, since Jules can cite the diagrams. Start an agent here only on an explicit yes, one at a time; if they decline, tell them they can ask any of them at any time."
